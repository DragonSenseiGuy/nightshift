# Allowlisting forward proxy for the sandbox. The sandbox has no internet of its
# own; its only route out is through this proxy, which permits exactly one host.

User nobody
Group nogroup
Port 3128
Timeout 600

# Clients that may use the proxy. Only sandbox containers on the internal Docker
# network can reach this port at all, so allow them through.
Allow 0.0.0.0/0

# Default-deny: every destination host is blocked unless it matches the filter file
# (written at startup from $ALLOW_HOST by entrypoint.sh).
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/filter"
FilterExtended On
FilterCaseSensitive Off

# Only allow HTTPS CONNECT tunnels to 443 — no tunnelling to arbitrary ports.
ConnectPort 443

LogLevel Info
